<head>
    <link rel="stylesheet" href="../static/css/index.css">
</head>


{% extends "base.html" %}

{% block title %}Login - U·PICK{% endblock %}

{% block content %}

    <section class="form_section">
        <div class="red form_div">
            <h1>ACCOUNT LOGIN</h1>
            <form action="/process-login" method="POST" class="form">

                <p class="light_text form_text1">USER NAME</p>
                <input class="input_box red" type="text" name="username" required>

                <p class="light_text form_text2">PASSWORD</p>
                <input class="input_box red" type="password" name="password" required>

                <input class="input_submit light_text" type="submit" value="SIGN IN" />
            </form>
            
            <p id="error" class="error"></p>

            <div style="
                align-self:flex-start;
                margin-top: 60px;
                display: flex;
                gap: 5px;
            ">
                <p class="light_text">Don't have any account yet?</p>
                <a class="light_text red" style="text-decoration: underline;" href="/register">Create Account</a>
            </div>
        </div>
    </section>

    <script src="../static/js/error.js"></script>
{% endblock %}
